devices:
  samplerate: 48000
  chunksize: 1024
  capture:
    type: Stdin
    channels: 2
    format: F32_LE
  playback:
    type: PipeWire
    channels: 2
    autoconnect_to: "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink"

filters:
  pre_gain:
    type: Gain
    parameters:
      gain: 0.0
      scale: dB
  bass:
    type: Biquad
    parameters:
      type: Lowshelf
      freq: 100
      gain: 4
      q: 0.7
  treble:
    type: Biquad
    parameters:
      type: Highshelf
      freq: 8000
      gain: 3
      q: 0.7
  limiter:
    type: Limiter
    parameters:
      clip_limit: -1.0
      soft_clip: false

processors:
  comp:
    type: Compressor
    parameters:
      channels: 2
      attack: 0.01
      release: 0.2
      threshold: -18.0
      factor: 2.0
      makeup_gain: 0.0

pipeline:
  - type: Filter
    channels: [0, 1]
    names:
      - pre_gain
      - bass
      - treble
      - limiter
  - type: Processor
    name: comp
