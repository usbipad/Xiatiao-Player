devices:
  samplerate: 48000
  chunksize: 1024
  capture:
    type: Stdin
    channels: 2
    format: F32_LE
  playback:
    type: PipeWire
    channels: 2
    autoconnect_to: "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink"

filters:
  peq1:
    type: Biquad
    parameters:
      type: Peaking
      freq: 1000
      gain: 3
      q: 1.0

mixers:
  width:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0
            inverted: false
            scale: dB
          - channel: 1
            gain: 0
            inverted: false
            scale: dB
      - dest: 1
        sources:
          - channel: 0
            gain: 0
            inverted: false
            scale: dB
          - channel: 1
            gain: 0
            inverted: false
            scale: dB

pipeline:
  - type: Filter
    channels: [0, 1]
    names:
      - peq1
  - type: Mixer
    name: width
