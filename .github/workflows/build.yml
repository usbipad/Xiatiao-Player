name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb (${{ matrix.deb_arch }})
    # 双架构矩阵：
    #   - amd64 用 ubuntu-22.04；arm64 用 ubuntu-24.04-arm（GitHub 提供的
    #     原生 arm64 托管 runner，公开仓库免费）。**不用 QEMU 模拟**——
    #     交叉/模拟构建 Rust + bindgen 慢一个数量级，且 ring/alsa 等
    #     依赖在模拟下容易踩到工具链坑。
    #   - container: debian:12 会自动拉取与 runner 同架构的镜像，
    #     因此两者都在 glibc 2.36 基线内构建，产物一致。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:12
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential debhelper devscripts \
            pkg-config libasound2-dev libpipewire-0.3-dev libclang-dev \
            curl ca-certificates xz-utils

      - name: Install Rust toolchain (rustup, into /usr/local/cargo)
        run: |
          export RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "/usr/local/cargo/bin" >> $GITHUB_PATH
          echo "RUSTUP_HOME=/usr/local/rustup" >> $GITHUB_ENV
          echo "CARGO_HOME=/usr/local/cargo" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Ensure vendored deps
        run: |
          if [ ! -d audio_backend_rs/vendor ]; then
            (cd audio_backend_rs && cargo vendor vendor >/dev/null)
          fi

      - name: Build .deb
        run: dpkg-buildpackage -B -us -uc -d

      - name: Collect artifact
        run: |
          mkdir -p dist
          # 通用架构通配：产出 xiatiao-player_<版本>_<deb架构>.deb。
          # 注意排除 dbgsym（文件名以 xiatiao-player-dbgsym_ 开头，不匹配）。
          cp ../xiatiao-player_[0-9]*.deb dist/ 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v5
        with:
          name: deb-package-${{ matrix.deb_arch }}
          path: dist/*.deb

  rpm:
    name: Build .rpm (${{ matrix.rpm_arch }})
    # 同 deb：用原生 runner，不模拟。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build cargo rust pkgconf-pkg-config \
            alsa-lib-devel pipewire-devel clang-devel \
            desktop-file-utils libappstream-glib git tar xz

      - uses: actions/checkout@v5

      - name: Build .rpm
        run: |
          # 版本号从 debian/changelog 首行动态解析（唯一真相，避免硬编码漂移；
          # rpm spec 的 Version 也据此保持同步）。
          VER="$(head -1 debian/changelog | sed -E 's/^[^(]+\(([^)]+)\).*/\1/')"
          [ -n "$VER" ] || { echo "无法解析版本号" >&2; exit 1; }
          SRC="Xiatiao-Player-${VER}"
          echo "==> 构建版本: $SRC"
          mkdir -p ~/rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          tar czf "$HOME/rpmbuild/SOURCES/${SRC}.tar.gz" \
            --transform "s,^,${SRC}/," \
            --exclude='.git' --exclude='audio_backend_rs/target' \
            --exclude='audio_backend_rs/vendor' --exclude='__pycache__' \
            --exclude='*.pyc' .
          cp rpm/xiatiao-player.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/xiatiao-player.spec

      - name: Collect artifact
        run: |
          mkdir -p dist
          # 架构目录随 runner 变化（x86_64 / aarch64），用通配。
          cp ~/rpmbuild/RPMS/*/*.rpm dist/ 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v5
        with:
          name: rpm-package-${{ matrix.rpm_arch }}
          path: dist/*.rpm

  release:
    name: Upload to Release
    needs: [deb, rpm]
    # 仅正式版 tag（vX.Y.Z，不含连字符）发布 Release；测试 tag 只出 Artifact
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          # 各架构产物是独立 artifact（deb-package-amd64 / rpm-package-aarch64 …），
          # 合并到同一目录，避免发布步骤里写死架构路径。
          merge-multiple: true

      - name: Determine release notes
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -f "release/RELEASE_NOTES_${VER}.md" ]; then
            echo "file=release/RELEASE_NOTES_${VER}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: List artifacts
        run: ls -la artifacts/

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          name: Xiatiao Player ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            artifacts/xiatiao-player_[0-9]*.deb
            artifacts/xiatiao-player-[0-9]*.rpm
