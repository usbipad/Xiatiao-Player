<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- 歌词：长短错落的文本行，模拟歌词本/歌词卡片的排版。
       此前用过双引号（太抽象）与麦克风（表示「唱」而非「词」），
       均与「歌词 = 文本」关联弱。改用最直白的文本行表达。
       线条长短有节奏（长-中-长-短），区别于等长的列表图标。
       纯 fill，GTK symbolic 可靠渲染。 -->
  <g fill="currentColor">
    <rect x="2.0" y="2.9"  width="12.0" height="1.6" rx="0.8"/>
    <rect x="2.0" y="6.1"  width="8.6"  height="1.6" rx="0.8"/>
    <rect x="2.0" y="9.3"  width="12.0" height="1.6" rx="0.8"/>
    <rect x="2.0" y="12.5" width="6.4"  height="1.6" rx="0.8"/>
  </g>
</svg>
